sonar.projectKey=repr-man
sonar.projectName=repr-man-web
# SonarCloud only: set GitHub repo variable SONAR_ORGANIZATION (organization key from SonarCloud).
# Do not add sonar.organization here when using self-hosted SonarQube Server.

sonar.sources=apps,libs
sonar.tests=apps,libs

sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/cdk.out/**,**/*.d.ts,**/*.js.map,apps/server/dist/**,apps/server/cdk.out/**,apps/server/**/*.js,apps/client-web/src/modules/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/cdk.out/**,apps/server/dist/**,apps/server/cdk.out/**

sonar.javascript.lcov.reportPaths=apps/client-web/coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=10

sonar.sourceEncoding=UTF-8
