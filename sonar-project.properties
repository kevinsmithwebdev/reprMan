sonar.projectKey=kevinsmithwebdev_reprMan
sonar.projectName=reprMan
# SonarCloud only: set GitHub repo variable SONAR_ORGANIZATION to the organization key
# (Administration → Key in SonarCloud), NOT this project key. Example:
#   sonar.projectKey=kevinsmithwebdev_reprMan  ← project key (this file)
#   SONAR_ORGANIZATION=kevinsmithwebdev        ← organization key (GitHub variable)
# Do not add sonar.organization here when using self-hosted SonarQube Server.

sonar.sources=apps,libs
sonar.tests=apps,libs

sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
# cdk.out: CDK synth copies the same bundled server code per Lambda asset hash — not source.
# apps/server/**/*.js: compiled handler output; analyze apps/server/src TypeScript only.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/cdk.out/**,**/*.d.ts,**/*.js.map,apps/server/dist/**,apps/server/cdk.out/**,apps/server/**/*.js
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/cdk.out/**,apps/server/dist/**,apps/server/cdk.out/**

sonar.javascript.lcov.reportPaths=apps/client-web/coverage/lcov.info
sonar.coverage.exclusions=**/vite.config.ts,**/setupTests.ts
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=10

sonar.sourceEncoding=UTF-8
