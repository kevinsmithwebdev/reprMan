name: Continuous Deployment
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    # CRA reads these at build time. Use Repository secrets and/or Variables with the same names.
    env:
      REACT_APP_COGNITO_USER_POOL_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_ID || vars.REACT_APP_COGNITO_USER_POOL_ID }}
      REACT_APP_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_CLIENT_ID || vars.REACT_APP_COGNITO_USER_POOL_CLIENT_ID }}
      REACT_APP_COGNITO_IDENTITY_POOL_ID: ${{ secrets.REACT_APP_COGNITO_IDENTITY_POOL_ID || vars.REACT_APP_COGNITO_IDENTITY_POOL_ID }}
      REACT_APP_REPRS_API_BASE_URL: ${{ secrets.REACT_APP_REPRS_API_BASE_URL || vars.REACT_APP_REPRS_API_BASE_URL }}
      REACT_APP_REQUIRE_HOME_SIGN_IN: ${{ secrets.REACT_APP_REQUIRE_HOME_SIGN_IN || vars.REACT_APP_REQUIRE_HOME_SIGN_IN }}
      REACT_APP_ALLOW_ANONYMOUS_HOME: ${{ secrets.REACT_APP_ALLOW_ANONYMOUS_HOME || vars.REACT_APP_ALLOW_ANONYMOUS_HOME }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install
        run: |
          yarn install
      - name: Build
        run: |
          yarn build
      - name: Inspect - Prettier, Lint, Unit Tests
        run: |
          yarn inspect
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Show AWS account (verify this is the account that owns the bucket)
        run: |
          aws sts get-caller-identity
          echo "If the bucket reprman.com was created in a different AWS account, create an IAM user in the bucket's account and set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY to that user's keys."

      - name: List S3 buckets (sanity check – bucket names may be masked)
        run: |
          echo "Buckets in this account (names may appear as ***):"
          aws s3 ls || true

      - name: Verify S3 bucket exists
        run: |
          BUCKET="${{ secrets.AWS_TEST_BUCKET_NAME }}"
          REGION="${{ secrets.AWS_REGION }}"
          if [ -z "$BUCKET" ]; then
            echo "::error::Secret AWS_TEST_BUCKET_NAME is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          if ! aws s3 ls "s3://$BUCKET/" --region "$REGION" 2>&1; then
            echo "::error::Bucket not found or no access. Check: (1) AWS_TEST_BUCKET_NAME is exactly the bucket name (e.g. reprman.com). (2) AWS_REGION matches the bucket region (e.g. eu-west-3 for Paris). (3) IAM user has s3:ListBucket and s3:PutObject on this bucket."
            exit 1
          fi

      - name: Deploy to S3
        run: |
          BUCKET="${{ secrets.AWS_TEST_BUCKET_NAME }}"
          REGION="${{ secrets.AWS_REGION }}"

          # 1) Deploy versioned/static assets with long cache.
          aws s3 sync apps/client-web/build "s3://$BUCKET/" \
            --region "$REGION" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

          # 2) Deploy index.html with no-cache so clients pick up new bundles quickly.
          aws s3 cp apps/client-web/build/index.html "s3://$BUCKET/index.html" \
            --region "$REGION" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID="${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "AWS_CLOUDFRONT_DISTRIBUTION_ID is not set; skipping CloudFront invalidation."
            echo "Set this secret to make deploys visible in minutes instead of waiting for TTL expiry."
            exit 0
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
