name: Continuous Deployment
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install
      run: |
        yarn install
    - name: Build
      run: |
        yarn build
    - name: Inspect - Prettier, Lint, Unit Tests
      run: |
        yarn inspect
    - name: Check S3 bucket secret
      run: |
        if [ -z "${{ secrets.AWS_TEST_BUCKET_NAME }}" ]; then
          echo "::error::AWS_TEST_BUCKET_NAME secret is not set. Add it in repo Settings → Secrets and variables → Actions."
          exit 1
        fi
    - name: Deploy to S3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --delete
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_TEST_BUCKET_NAME }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        SOURCE_DIR: "apps/client-web/build"