name: Continuous Deployment
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    # CRA reads these at build time. Use Repository secrets and/or Variables with the same names.
    env:
      REACT_APP_COGNITO_USER_POOL_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_ID || vars.REACT_APP_COGNITO_USER_POOL_ID }}
      REACT_APP_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_CLIENT_ID || vars.REACT_APP_COGNITO_USER_POOL_CLIENT_ID }}
      REACT_APP_COGNITO_IDENTITY_POOL_ID: ${{ secrets.REACT_APP_COGNITO_IDENTITY_POOL_ID || vars.REACT_APP_COGNITO_IDENTITY_POOL_ID }}
      REACT_APP_REQUIRE_HOME_SIGN_IN: ${{ secrets.REACT_APP_REQUIRE_HOME_SIGN_IN || vars.REACT_APP_REQUIRE_HOME_SIGN_IN }}
      REACT_APP_ALLOW_ANONYMOUS_HOME: ${{ secrets.REACT_APP_ALLOW_ANONYMOUS_HOME || vars.REACT_APP_ALLOW_ANONYMOUS_HOME }}

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install
      run: |
        yarn install
    - name: Build
      run: |
        yarn build
    - name: Inspect - Prettier, Lint, Unit Tests
      run: |
        yarn inspect
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Show AWS account (verify this is the account that owns the bucket)
      run: |
        aws sts get-caller-identity
        echo "If the bucket reprman.com was created in a different AWS account, create an IAM user in the bucket's account and set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY to that user's keys."

    - name: List S3 buckets (sanity check – bucket names may be masked)
      run: |
        echo "Buckets in this account (names may appear as ***):"
        aws s3 ls || true

    - name: Verify S3 bucket exists
      run: |
        BUCKET="${{ secrets.AWS_TEST_BUCKET_NAME }}"
        REGION="${{ secrets.AWS_REGION }}"
        if [ -z "$BUCKET" ]; then
          echo "::error::Secret AWS_TEST_BUCKET_NAME is not set. Add it in Settings → Secrets and variables → Actions."
          exit 1
        fi
        if ! aws s3 ls "s3://$BUCKET/" --region "$REGION" 2>&1; then
          echo "::error::Bucket not found or no access. Check: (1) AWS_TEST_BUCKET_NAME is exactly the bucket name (e.g. reprman.com). (2) AWS_REGION matches the bucket region (e.g. eu-west-3 for Paris). (3) IAM user has s3:ListBucket and s3:PutObject on this bucket."
          exit 1
        fi

    - name: Deploy to S3
      run: |
        aws s3 sync apps/client-web/build s3://${{ secrets.AWS_TEST_BUCKET_NAME }}/ \
          --region ${{ secrets.AWS_REGION }} \
          --delete