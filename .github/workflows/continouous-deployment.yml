name: Continuous Deployment
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install
      run: |
        yarn install
    - name: Build
      run: |
        yarn build
    - name: Inspect - Prettier, Lint, Unit Tests
      run: |
        yarn inspect
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Verify S3 bucket exists
      run: |
        BUCKET="${{ secrets.AWS_TEST_BUCKET_NAME }}"
        if [ -z "$BUCKET" ]; then
          echo "::error::Secret AWS_TEST_BUCKET_NAME is not set. Add it in Settings → Secrets and variables → Actions."
          exit 1
        fi
        if ! aws s3 ls "s3://$BUCKET/" 2>&1; then
          echo "::error::Bucket '$BUCKET' not found or credentials lack access. Create the bucket in the AWS Console (region: ${{ secrets.AWS_REGION }}) or fix the secret."
          exit 1
        fi

    - name: Deploy to S3
      run: |
        aws s3 sync apps/client-web/build s3://${{ secrets.AWS_TEST_BUCKET_NAME }}/ \
          --acl public-read \
          --delete