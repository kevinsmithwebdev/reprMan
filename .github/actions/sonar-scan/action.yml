name: SonarQube scan
description: Validate Sonar config, verify coverage, and run a blocking quality-gate scan.

inputs:
  sonar-token:
    description: SonarQube / SonarCloud analysis token
    required: true
  sonar-organization:
    description: SonarCloud organization key (required for SonarCloud)
    required: false
    default: ''
  sonar-host-url:
    description: Self-hosted SonarQube Server URL (omit for SonarCloud)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate Sonar configuration
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
      run: |
        set -euo pipefail
        if [ -z "$SONAR_TOKEN" ]; then
          echo "::error::SONAR_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions."
          exit 1
        fi
        if [ -n "$SONAR_ORGANIZATION" ]; then
          echo "sonar_mode=cloud" >> "$GITHUB_ENV"
          echo "Using SonarCloud (organization: $SONAR_ORGANIZATION)."
        elif [ -n "$SONAR_HOST_URL" ]; then
          if echo "$SONAR_HOST_URL" | grep -qi sonarcloud; then
            echo "::error::SONAR_HOST_URL points to SonarCloud but sonar-organization is not set."
            echo "Set repository variable SONAR_ORGANIZATION and remove SONAR_HOST_URL."
            exit 1
          fi
          echo "sonar_mode=server" >> "$GITHUB_ENV"
          echo "Using SonarQube Server at $SONAR_HOST_URL"
        else
          echo "::error::Set repository variable SONAR_ORGANIZATION (SonarCloud) or SONAR_HOST_URL (self-hosted SonarQube Server)."
          exit 1
        fi

    - name: Verify coverage report
      shell: bash
      run: |
        set -euo pipefail
        test -f apps/client-web/coverage/lcov.info || {
          echo "::error::Missing apps/client-web/coverage/lcov.info. Run tests with coverage before the Sonar scan."
          exit 1
        }

    - name: SonarQube Scan (SonarCloud)
      if: env.sonar_mode == 'cloud'
      uses: SonarSource/sonarqube-scan-action@v7.1.0
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      with:
        args: -Dsonar.organization=${{ inputs.sonar-organization }}

    - name: SonarQube Scan (SonarQube Server)
      if: env.sonar_mode == 'server'
      uses: SonarSource/sonarqube-scan-action@v7.1.0
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
