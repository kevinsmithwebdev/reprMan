# Bump minor version on each push to the default branch (e.g. after a merge).
# Requires a project access token (or PAT) with write_repository — set CI variable
# VERSION_BUMP_TOKEN: project access token (or PAT) with write_repository, masked.
# Push URL uses oauth2 as the username (GitLab token convention). The bump commit
# uses [skip ci] so GitLab does not
# start a second pipeline; see https://docs.gitlab.com/ee/ci/pipelines/index.html#skip-a-pipeline
#
# Manual bumps anytime: yarn version:bump:minor | yarn version:bump:major

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - version

# Keeps MR pipelines non-empty when the only other job is default-branch-only.
merge-request-placeholder:
  stage: check
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "OK (run yarn inspect or your own MR checks in this job if desired)"

bump-minor-on-main:
  stage: version
  image: node:20-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    GIT_DEPTH: '50'
  before_script:
    - apk add --no-cache git
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
    - git config user.name "GitLab CI"
  script:
    - |
      if echo "${CI_COMMIT_MESSAGE}" | grep -q '\[skip ci\]'; then
        echo "Skipping version bump ([skip ci] commit)."
        exit 0
      fi
    - |
      if [ -z "${VERSION_BUMP_TOKEN}" ]; then
        echo "VERSION_BUMP_TOKEN is not set; skipping automated minor bump."
        echo "Set a token with write_repository, or run yarn version:bump:minor locally."
        exit 0
      fi
    - node scripts/bump-version.mjs minor
    - |
      if git diff --quiet package.json apps/client-web/package.json; then
        echo "No version file changes."
        exit 0
      fi
    - git add package.json apps/client-web/package.json
    - git commit -m "chore: bump minor version [skip ci]"
    - git push "https://oauth2:${VERSION_BUMP_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
