# Version bumps are handled locally at commit time:
# - regular git commit => patch bump via pre-commit hook
# - yarn bump:minor -- -m "message"
# - yarn bump:major -- -m "message"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check

# Keeps MR pipelines non-empty when the only other job is default-branch-only.
merge-request-placeholder:
  stage: check
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "OK (run yarn inspect or your own MR checks in this job if desired)"
